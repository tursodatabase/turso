[package]
name = "turso_pg_catalog"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The built-in rows of PostgreSQL's system catalogs, for Turso"

[lints]
workspace = true

[dependencies]
# The built-in rows of each catalog write themselves as values of core. A user of this crate
# chooses the other features of core. Core does not build without "fs".
turso_core = { path = "../../core", version = "0.9.0-pre.6", default-features = false, features = ["fs"] }

[dev-dependencies]
turso_pg_catalog_gen = { path = "generator" }
