[package]
name = "turso_pg_catalog"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The built-in rows of PostgreSQL's system catalogs, for Turso"

[lints]
workspace = true

[dependencies]
# The seed of each catalog is a seeded table of core. A user of this crate
# chooses the other features of core. Core does not build without "fs".
turso_core = { path = "../../core", version = "0.9.0-pre.6", default-features = false, features = ["fs"] }

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = { workspace = true }
turso_core = { workspace = true }
turso_pg_catalog_gen = { path = "generator" }
turso_sqlite = { workspace = true }
