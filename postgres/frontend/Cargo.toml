[package]
name = "turso_pg"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL frontend for Turso"

[lib]
path = "lib.rs"

[dependencies]
bitflags = { workspace = true }
chrono = { workspace = true, default-features = false, features = ["clock"] }
chumsky = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = "2.0"
ryu = "1.0.19"
serde_json = { workspace = true }
strum = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
turso_core = { workspace = true, default-features = true, features = [
    "conn_raw_api",
] }
turso_parser = { workspace = true }
turso_ext = { workspace = true, features = ["core_only"] }
turso_pg_parser = { workspace = true }
uuid = "1.11.0"

[dev-dependencies]
turso_core = { workspace = true, features = ["io_memory_yield", "test_helper"] }

[lints]
workspace = true
