[project]
name = "thesis"
version = "0.1.0"
description = "Local, seeded runner for Antithesis Test Composer templates"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
thesis = "thesis.cli:main"

[dependency-groups]
dev = ["pytest>=8", "antithesis>=0.1.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
