[package]
name = "turso_sync_sdk_kit"
description = "Low-level C ABI for Turso Cloud sync in language bindings. For Rust applications, use the `turso` crate instead."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["simd"]
pure-rust-crypto = ["turso_core/pure-rust-crypto", "turso_sdk_kit/pure-rust-crypto"]
fts = ["turso_core/fts", "turso_sdk_kit/fts"]
simd = ["turso_core/simd", "turso_sync_engine/simd", "turso_sdk_kit/simd"]

[lib]
doc = false
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
env_logger = { workspace = true, default-features = false }
turso_core = { path = "../../core", version = "0.9.0-pre.2", default-features = false, features = ["baseline"] }
turso_sync_engine = { path = "../engine", version = "0.9.0-pre.2", default-features = false }
turso_sdk_kit = { path = "../../sdk-kit", version = "0.9.0-pre.2", default-features = false, features = [
    "encryption",
    "pure-rust-crypto",
] }
turso_sdk_kit_macros = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
genawaiter = { version = "0.99.1", default-features = false }
parking_lot = { workspace = true, features = ["arc_lock", "send_guard"] }

# Rolling file appender: no filesystem to roll onto in a browser, and its symlink path does not
# compile for wasm.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tracing-appender = { workspace = true }

[build-dependencies]
bindgen = "0.69.5"
