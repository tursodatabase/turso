[[bench]]
name = "json_benchmark"
path = "json_benchmark.rs"
harness = false

[[bench]]
name = "tpc_h_benchmark"
path = "tpc_h_benchmark.rs"
harness = false

[[bench]]
name = "sql_functions"
path = "sql_functions/main.rs"
