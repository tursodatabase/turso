[package]
name = "turso_benches"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Benchmarks for the Turso engine"
publish = false
autobenches = false

[lib]
path = "lib.rs"

[dependencies]
turso_core = { workspace = true }
turso_sqlite = { workspace = true }
turso_macros = { workspace = true }
criterion = { workspace = true, features = [
    "html_reports",
    "async",
    "async_futures",
] }
codspeed-criterion-compat = { workspace = true, features = [
    "html_reports",
    "async",
    "async_futures",
] }
divan.workspace = true
mimalloc = { workspace = true, default-features = false }
rusqlite = { workspace = true, features = ["series"] }
tempfile = { workspace = true }
asserting = { workspace = true }
regex = { workspace = true }
rustc-hash = "2.0"

[features]
default = ["fts"]
bench = ["turso_core/bench"]
nanosecond-bench = ["bench", "turso_core/nanosecond-bench"]
codspeed = ["bench", "turso_core/codspeed"]
fts = ["turso_core/fts"]
test_helper = ["turso_core/test_helper"]

[[bench]]
name = "benchmark"
path = "benchmark.rs"
harness = false

[[bench]]
name = "count_benchmark"
path = "count_benchmark.rs"
harness = false

[[bench]]
name = "mvcc_benchmark"
path = "mvcc_benchmark.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "mvcc_recovery_benchmark"
path = "mvcc_recovery_benchmark.rs"
harness = false

[[bench]]
name = "mvcc_checkpoint_benchmark"
