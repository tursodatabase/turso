[package]
name = "core_tester"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Integration & fuzz tests"

[lib]
path = "lib.rs"

[[test]]
name = "integration_tests"
path = "integration/mod.rs"

[[test]]
name = "fuzz_tests"
path = "fuzz/mod.rs"

[[test]]
name = "pending_byte_tests"
path = "fuzz/pending_byte.rs"

# Separate binary: uses a counting #[global_allocator] to detect
# per-database memory leaks, which must not affect the other test targets.
[[test]]
name = "leak_tests"
path = "leak/mod.rs"

[dependencies]
turso_sqlite = { workspace = true }
anyhow.workspace = true
env_logger = { workspace = true }
turso_core = { workspace = true, features = ["conn_raw_api"] }
turso_ext.workspace = true
turso_sdk_kit = { path = "../sdk-kit" }
turso = { workspace = true }
tokio = { workspace = true, features = ["full"] }
rusqlite.workspace = true
tempfile = { workspace = true }
log = "0.4.22"
assert_cmd = "^2"
rand_chacha = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
zerocopy = "0.8.26"
ctor = "0.5.0"
twox-hash = "2.1.1"
sql_generation = { path = "../sql_generation" }
turso_parser = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing = { workspace = true }
turso-dbhash.workspace = true
tantivy = { version = "0.26.2", optional = true }
tantivy-common = { version = "0.11.0", optional = true }

[dev-dependencies]
branches = { version = "0.4.3", default-features = false }
bytemuck = "1.23.1"
crc32c = "0.6.8"
memory-stats = "1.2.0"
pack1 = { version = "1.0.0", features = ["bytemuck"] }
parking_lot = { workspace = true, features = ["arc_lock"] }
quickcheck = { version = "1.0", default-features = false }
quickcheck_macros = { version = "1.0", default-features = false }
rstest = "0.18.2"
rustc-hash = "2.0"
sorted-vec = "0.8.6"
similar-asserts.workspace = true
asserting.workspace = true
serial_test = { version = "3", features = ["file_locks"] }
test-log = { version = "0.2.17", features = ["trace"] }
turso_macros.workspace = true
crossbeam-epoch = "0.9.18"

[features]
default = [
    "test_helper",
    "fts",
    "io_uring",
    "fs",
    "uuid",
    "time",
    "json",
    "series",
    "encryption",
    "percentile",
    "autovacuum",
    "conn_raw_api",
]
fs = ["turso_core/fs"]
uuid = ["turso_core/uuid"]
time = ["turso_core/time"]
json = ["turso_core/json"]
series = ["turso_core/series"]
encryption = ["turso_core/encryption"]
percentile = ["turso_core/percentile"]
autovacuum = ["turso_core/autovacuum"]
conn_raw_api = []
allocation_metric = ["turso_core/allocation_metric"]
simulator = ["turso_core/simulator"]
checksum = ["turso_core/checksum"]
test_helper = ["turso_core/test_helper"]
fts = ["turso_core/fts", "dep:tantivy", "dep:tantivy-common"]
io_memory_yield = ["turso_core/io_memory_yield"]
io_uring = ["turso_core/io_uring"]
win_iocp = ["turso_core/experimental_win_iocp"]
pure-rust-crypto = ["turso_core/pure-rust-crypto"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(shuttle)', 'cfg(antithesis)', 'cfg(nightly)'] }
unstable_name_collisions = "allow"
