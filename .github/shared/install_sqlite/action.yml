name: "Install SQLite"
description: "Installs sqlite3 CLI for compat tests that invoke it as a subprocess (make test-compat)"

runs:
  using: "composite"
  steps:
    - name: Install SQLite
      # The version comes from sqlite/version (read by scripts/install-sqlite3.sh).
      run: |
        "$GITHUB_WORKSPACE/scripts/install-sqlite3.sh"
        echo "$GITHUB_WORKSPACE/.sqlite3" >> "$GITHUB_PATH"
        "$GITHUB_WORKSPACE/.sqlite3/sqlite3" --version
      shell: bash
