name: Setup Bazel
description: Install the repository's Bazel version with Bazelisk

runs:
  using: composite
  steps:
    - name: Preserve Bazel labels in Git Bash
      if: runner.os == 'Windows'
      shell: bash
      run: echo 'MSYS2_ARG_CONV_EXCL=*' >> "$GITHUB_ENV"
    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
