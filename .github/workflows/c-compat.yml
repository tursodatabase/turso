name: C compat Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows MSVC
            os: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Install SQLite
        if: runner.os == 'Windows'
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          vcpkg install sqlite3:x64-windows-static-md
      - name: Build and test Turso C bindings on Linux
        if: runner.os != 'Windows'
        run: bazel test //bindings/c/... --lockfile_mode=error --test_output=errors --test_arg=--test-threads=1
      - name: Build and test Turso C bindings on Windows
        if: runner.os == 'Windows'
        run: |
          $sqliteLibDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md\lib"
          if (-not (Test-Path "$sqliteLibDir\sqlite3.lib")) {
            throw "SQLite library not found at $sqliteLibDir\sqlite3.lib"
          }
          bazel test //bindings/c/... --jobs=1 "--@rules_rust//rust/settings:extra_rustc_flag=-Clink-arg=/LIBPATH:$sqliteLibDir" --lockfile_mode=error --test_output=errors --test_arg=--test-threads=1
      - name: Run C tests against real SQLite
        if: runner.os == 'Linux'
        working-directory: bindings/c/tests
        run: make clean && make LIBS="-lsqlite3" && ./sqlite3-tests
      - name: Run C tests against Turso
        if: runner.os == 'Linux'
        working-directory: bindings/c/tests
        run: |
          make clean
          make LIBS="-L../../../bazel-bin/bindings/c -lturso_sqlite3"
          LD_LIBRARY_PATH=../../../bazel-bin/bindings/c ./sqlite3-tests
