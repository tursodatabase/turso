name: C compat Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: 10
  CC_x86_64_pc_windows_msvc: cl.exe

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows MSVC
            os: blacksmith-4vcpu-windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust(stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: "./.github/shared/setup-msvc"

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install SQLite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows-static-md

      - name: Build Turso C bindings
        run: cargo build -p turso_sqlite3 --features capi --locked

      - name: Run C compat tests from Rust
        if: runner.os == 'Linux'
        working-directory: bindings/c
        run: cargo test --locked

      - name: Run C compat tests from Rust (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked -p turso_sqlite3 --test compat -- --test-threads=1

      - name: Run C compat C tests linking against real SQLite
        if: runner.os == 'Linux'
        working-directory: bindings/c/tests
        run: |
          make clean
          make LIBS="-lsqlite3"
          ./sqlite3-tests

      - name: Run C compat C tests linking against Turso
        if: runner.os == 'Linux'
        working-directory: bindings/c/tests
        run: |
          make clean
          make LIBS="-L../../../target/debug -lturso_sqlite3"
          LD_LIBRARY_PATH=../../../target/debug ./sqlite3-tests

      - name: Run C compat C tests linking against real SQLite (Windows)
        if: runner.os == 'Windows'
        working-directory: bindings/c/tests
        run: |
          cl.exe /nologo /W4 /MD /I../include sqlite3_tests.c /Fe:sqlite3-tests.exe /link /LIBPATH:"$env:VCPKG_ROOT/installed/x64-windows-static-md/lib" sqlite3.lib
          ./sqlite3-tests.exe

      - name: Run C compat C tests linking against Turso (Windows)
        if: runner.os == 'Windows'
        working-directory: bindings/c/tests
        run: |
          cl.exe /nologo /W4 /MD /I../include sqlite3_tests.c /Fe:sqlite3-tests.exe /link /LIBPATH:../../../target/debug turso_sqlite3.dll.lib
          $env:PATH = "$(Resolve-Path ../../../target/debug);$env:PATH"
          ./sqlite3-tests.exe
