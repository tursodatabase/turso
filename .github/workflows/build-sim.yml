name: Build and push limbo-sim image

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Add permissions needed for OIDC authentication with AWS
permissions:
  id-token: write # allow getting OIDC token
  contents: read # allow reading repository contents

# Ensure only one build runs at a time. A new push to main will cancel any in-progress build.
concurrency:
  group: "build-sim"
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.LIMBO_SIM_AWS_REGION }}
  IAM_ROLE: ${{ secrets.LIMBO_SIM_DEPLOYER_IAM_ROLE }}
  ECR_URL: ${{ secrets.LIMBO_SIM_ECR_URL }}
  ECR_IMAGE_NAME: ${{ secrets.LIMBO_SIM_IMAGE_NAME }}
  GIT_HASH: ${{ github.sha }}

jobs:
  deploy:
    runs-on: blacksmith
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push limbo-sim docker image
        uses: useblacksmith/build-push-action@39d1b1a90b3dd4f04cd9e61ee11e097b9028e9ae # v1.1.2
        with:
          context: .
          file: testing/simulator/simulator-docker-runner/Dockerfile.simulator
          push: true
          tags: ${{ env.ECR_URL }}/${{ env.ECR_IMAGE_NAME }}
          build-args: |
            GIT_HASH=${{ env.GIT_HASH }}
