name: Run long fuzz tests and stress test

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  fuzz-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_tests, pending_byte_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Run ${{ matrix.target }}
        env:
          RUST_BACKTRACE: 1
          FUZZ_MULTIPLIER: "0.5"
        run: bazel test //tests:${{ matrix.target }} --lockfile_mode=error --test_output=errors

  long-fuzz-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Run ignored long fuzz tests
        env:
          RUST_BACKTRACE: 1
          FUZZ_MULTIPLIER: "0.5"
        run: bazel test //tests:fuzz_tests_binary --lockfile_mode=error --test_output=errors --test_arg=--ignored --test_arg=fuzz_long

  stress-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Run stress test
        run: bazel run //testing/stress:turso_stress --lockfile_mode=error -- --nr-threads 3 --nr-iterations 300

  libfuzzer-scalar-func:
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Run scalar_func fuzzer
        run: bazel run //fuzz:scalar_func --lockfile_mode=error -- -max_total_time=300
