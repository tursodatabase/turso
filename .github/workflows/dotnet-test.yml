name: Dotnet Tests

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  working-directory: bindings/dotnet

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ env.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel

      - name: Install dotnet sdk 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build native libraries
        working-directory: ${{ github.workspace }}
        run: |
          bazel build \
            //sync/sdk-kit:turso_sync_sdk_kit_cdylib \
            //sync/sdk-kit:turso_sync_sdk_kit_staticlib
          mkdir -p bindings/dotnet/rs_compiled/x86_64-unknown-linux-gnu/debug
          cp bazel-bin/sync/sdk-kit/libturso_sync_sdk_kit.so \
            bindings/dotnet/rs_compiled/x86_64-unknown-linux-gnu/debug/libturso_sdk_kit.so
          cp bazel-bin/sync/sdk-kit/libturso_sync_sdk_kit.a \
            bindings/dotnet/rs_compiled/x86_64-unknown-linux-gnu/debug/libturso_sdk_kit.a

      - name: Run tests
        run: |
          dotnet build ./src/Turso.Data/Turso.Data.csproj
          dotnet build ./src/Turso.Data.Sqlite/Turso.Data.Sqlite.csproj
          dotnet build ./src/Turso.EntityFrameworkCore.Sqlite/Turso.EntityFrameworkCore.Sqlite.csproj
          dotnet build ./src/Turso.Platform.Client/Turso.Platform.Client.csproj
          dotnet build ./src/Turso.Serverless.Client/Turso.Serverless.Client.csproj
          dotnet test ./src/Turso.Tests/Turso.Tests.csproj
