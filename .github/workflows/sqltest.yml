name: SQL Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  sqltest-check:
    name: Check .sqltest syntax
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Build test runner
        run: bazel build //testing/sqltest:sqltest --config=ci-opt
      - name: Check test syntax
        working-directory: sqlite/conformance
        run: |
          ../../bazel-bin/testing/sqltest/sqltest check sqlite-sqltests
          ../../bazel-bin/testing/sqltest/sqltest check turso-sqltests
      - name: Check pg test syntax
        working-directory: postgres/conformance
        run: ../../bazel-bin/testing/sqltest/sqltest check pg-sqltests

  sqltest-run-cli:
    name: Run SQL tests (CLI backend)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - uses: "./.github/shared/install_sqlite"
      - name: Build CLI and test runner
        run: bazel build //cli:tursodb //testing/sqltest:sqltest
      - name: Run tests
        working-directory: sqlite/conformance
        run: |
          ../../bazel-bin/testing/sqltest/sqltest run sqlite-sqltests --timeout 600 --backend cli --binary ../../bazel-bin/cli/tursodb --cross-check-binary sqlite3
          ../../bazel-bin/testing/sqltest/sqltest run turso-sqltests --backend cli --binary ../../bazel-bin/cli/tursodb --cross-check-binary sqlite3
      - name: Run tests (MVCC)
        working-directory: sqlite/conformance
        run: |
          ../../bazel-bin/testing/sqltest/sqltest run sqlite-sqltests --timeout 600 --backend cli --binary ../../bazel-bin/cli/tursodb --mvcc
          ../../bazel-bin/testing/sqltest/sqltest run turso-sqltests --backend cli --binary ../../bazel-bin/cli/tursodb --mvcc

  sqltest-run-rust:
    name: Run SQL tests (Rust backend)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Build test runner
        run: bazel build //testing/sqltest:sqltest --config=ci-opt
      - name: Run tests
        working-directory: sqlite/conformance
        run: |
          ../../bazel-bin/testing/sqltest/sqltest run sqlite-sqltests --backend rust
          ../../bazel-bin/testing/sqltest/sqltest run turso-sqltests --backend rust
      - name: Run tests (MVCC)
        working-directory: sqlite/conformance
        run: |
          ../../bazel-bin/testing/sqltest/sqltest run sqlite-sqltests --backend rust --mvcc
          ../../bazel-bin/testing/sqltest/sqltest run turso-sqltests --backend rust --mvcc

  sqltest-run-js:
    name: Run SQL tests (JS backend)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Setup node
        uses: useblacksmith/setup-node@v5
        with:
          node-version: 24
      - name: Install JS dependencies
        run: yarn install
      - name: Build common package
        run: yarn workspace @tursodatabase/database-common build
      - name: Build native bindings
        working-directory: .
        run: |
          bazel build //bindings/javascript:turso_node_cdylib //testing/sqltest:sqltest
          cp bazel-bin/bindings/javascript/libturso_node.so bindings/javascript/packages/native/turso.linux-x64-gnu.node
      - name: Build TypeScript
        run: yarn workspace @tursodatabase/database tsc-build
      - name: Run tests
        working-directory: sqlite/conformance
        run: |
          ../../bazel-bin/testing/sqltest/sqltest run sqlite-sqltests --backend js --js-script ../../bindings/javascript/turso-sql-runner.mjs
          ../../bazel-bin/testing/sqltest/sqltest run turso-sqltests --backend js --js-script ../../bindings/javascript/turso-sql-runner.mjs
      - name: Run tests (MVCC)
        working-directory: sqlite/conformance
        run: |
          ../../bazel-bin/testing/sqltest/sqltest run sqlite-sqltests --backend js --js-script ../../bindings/javascript/turso-sql-runner.mjs --mvcc
          ../../bazel-bin/testing/sqltest/sqltest run turso-sqltests --backend js --js-script ../../bindings/javascript/turso-sql-runner.mjs --mvcc

  sqltest-run-pg:
    name: Run SQL tests (pg backend)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Build tursopg and test runner
        run: bazel build //postgres/cli:tursopg //testing/sqltest:sqltest
      - name: Run tests
        working-directory: postgres/conformance
        run: ../../bazel-bin/testing/sqltest/sqltest run pg-sqltests --timeout 600 --backend pg --binary ../../bazel-bin/postgres/cli/tursopg

  sqltest-sqlite:
    name: Run SQL tests (SQLite)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - uses: "./.github/shared/install_sqlite"
      - name: Build test runner
        run: bazel build //testing/sqltest:sqltest
      - name: Run tests against SQLite
        working-directory: sqlite/conformance
        run: ../../bazel-bin/testing/sqltest/sqltest run sqlite-sqltests --timeout 600 --backend cli --binary ../../.sqlite3/sqlite3
