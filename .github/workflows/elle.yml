name: Elle Consistency Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      max_steps:
        description: Maximum simulation steps
        required: false
        default: "100000"
      seed:
        description: Random seed (leave empty for random)
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * *"

env:
  ELLE_CLI_REV: 65fafcfa939cced8b7d279db1b2a666929885e65

jobs:
  elle-check:
    name: Elle ${{ matrix.elle_model }} (${{ matrix.mode }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [default, mvcc, mvcc-passive]
        elle_model: [list-append, rw-register]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/lein
            ~/.lein
          key: lein-${{ runner.os }}
      - uses: actions/cache@v4
        with:
          path: /tmp/elle-cli
          key: elle-cli-${{ runner.os }}-${{ env.ELLE_CLI_REV }}
      - name: Build simulator
        run: bazel build //testing/concurrent-simulator:turso_whopper --lockfile_mode=error
      - name: Run simulation with Elle
        env:
          SEED: ${{ github.event.inputs.seed }}
        run: |
          MAX_STEPS="${{ github.event.inputs.max_steps }}"
          MAX_STEPS="${MAX_STEPS:-100000}"
          MVCC_FLAG=""
          test "${{ matrix.mode }}" = default || MVCC_FLAG="--enable-mvcc"
          if [ "${{ matrix.mode }}" = mvcc-passive ]; then
            MVCC_FLAG="$MVCC_FLAG --enable-experimental-mvcc-passive-checkpoint --mvcc-checkpoint-threshold 1024"
          fi
          bazel-bin/testing/concurrent-simulator/turso_whopper \
            --elle ${{ matrix.elle_model }} --elle-output elle-history.edn \
            --max-steps "$MAX_STEPS" $MVCC_FLAG
      - name: Setup Leiningen and elle-cli
        run: |
          if [ ! -x /tmp/lein/lein ]; then
            mkdir -p /tmp/lein
            curl -sL https://raw.githubusercontent.com/technomancy/leiningen/2.11.2/bin/lein -o /tmp/lein/lein
            chmod +x /tmp/lein/lein
          fi
          if [ ! -d /tmp/elle-cli/.git ]; then
            git init /tmp/elle-cli
            git -C /tmp/elle-cli remote add origin https://github.com/ligurio/elle-cli.git
            git -C /tmp/elle-cli fetch --depth 1 origin "$ELLE_CLI_REV"
            git -C /tmp/elle-cli checkout --detach FETCH_HEAD
          fi
          cd /tmp/elle-cli
          test -f target/*-standalone.jar || /tmp/lein/lein uberjar
      - name: Run Elle analysis
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          CONSISTENCY_FLAG="--consistency-models serializable"
          test "${{ matrix.mode }}" = default || CONSISTENCY_FLAG="--consistency-models snapshot-isolation"
          mkdir -p elle-results
          java -jar "$(ls -t /tmp/elle-cli/target/*-standalone.jar | head -1)" \
            --model ${{ matrix.elle_model }} $CONSISTENCY_FLAG --verbose \
            --directory elle-results elle-history.edn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elle-results-${{ matrix.elle_model }}-${{ matrix.mode }}
          path: |
            elle-history.edn
            elle-results/
          retention-days: 30
