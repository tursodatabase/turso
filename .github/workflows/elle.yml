name: Elle Consistency Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "Maximum simulation steps"
        required: false
        default: "100000"
      seed:
        description: "Random seed (leave empty for random)"
        required: false
        default: ""
  schedule:
    # Run nightly at 3am UTC
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ELLE_CLI_REV: 65fafcfa939cced8b7d279db1b2a666929885e65

jobs:
  elle-check:
    name: Elle ${{ matrix.elle_model }} (${{ matrix.mode }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [default, mvcc, mvcc-passive]
        elle_model: [list-append, rw-register]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          prefix-key: "v1-rust"
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Leiningen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/lein
            ~/.lein
          key: lein-${{ runner.os }}

      - name: Cache elle-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/elle-cli
          key: elle-cli-${{ runner.os }}-${{ env.ELLE_CLI_REV }}

      - name: Build simulator
        run: cargo build -p turso_whopper

      - name: Run simulation with Elle
        env:
          SEED: ${{ github.event.inputs.seed }}
        run: |
          SEED_ARG=""
          if [ -n "$SEED" ]; then
            export SEED="$SEED"
          fi
          MAX_STEPS="${{ github.event.inputs.max_steps }}"
          MAX_STEPS="${MAX_STEPS:-100000}"
          MVCC_FLAG=""
          if [ "${{ matrix.mode }}" != "default" ]; then
            MVCC_FLAG="--enable-mvcc"
          fi
          if [ "${{ matrix.mode }}" = "mvcc-passive" ]; then
            # Elle workloads write the logical log slowly; lower the checkpoint
            # threshold so passive checkpoints actually fire during the run.
            MVCC_FLAG="$MVCC_FLAG --enable-experimental-mvcc-passive-checkpoint --mvcc-checkpoint-threshold 1024"
          fi
          ./target/debug/turso_whopper \
            --elle ${{ matrix.elle_model }} \
            --elle-output elle-history.edn \
            --max-steps "$MAX_STEPS" \
            $MVCC_FLAG

      - name: Setup Leiningen
        run: |
          if [ ! -x /tmp/lein/lein ]; then
            mkdir -p /tmp/lein
            curl -sL https://raw.githubusercontent.com/technomancy/leiningen/2.11.2/bin/lein -o /tmp/lein/lein
            chmod +x /tmp/lein/lein
            /tmp/lein/lein version
          fi

      - name: Build elle-cli
        run: |
          if [ ! -d /tmp/elle-cli/.git ]; then
            mkdir -p /tmp/elle-cli
            git -C /tmp/elle-cli init
            git -C /tmp/elle-cli remote add origin https://github.com/ligurio/elle-cli.git
            git -C /tmp/elle-cli fetch --depth 1 origin "$ELLE_CLI_REV"
            git -C /tmp/elle-cli checkout --detach FETCH_HEAD
          fi
          cd /tmp/elle-cli
          if [ ! -f target/*-standalone.jar ]; then
            /tmp/lein/lein uberjar
          fi

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Run Elle analysis
        run: |
          ELLE_JAR=$(ls -t /tmp/elle-cli/target/*-standalone.jar | head -1)
          mkdir -p elle-results
          echo "Using JAR: $ELLE_JAR"
          echo "History file: $(pwd)/elle-history.edn"
          echo "History size: $(wc -l < elle-history.edn) events"
          echo ""
          CONSISTENCY_FLAG="--consistency-models serializable"
          if [ "${{ matrix.mode }}" != "default" ]; then
            CONSISTENCY_FLAG="--consistency-models snapshot-isolation"
          fi
          java -jar "$ELLE_JAR" --model ${{ matrix.elle_model }} $CONSISTENCY_FLAG --verbose --directory elle-results elle-history.edn

      - name: Upload Elle results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: elle-results-${{ matrix.elle_model }}-${{ matrix.mode }}
          path: |
            elle-history.edn
            elle-results/
          retention-days: 30
