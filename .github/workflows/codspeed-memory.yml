# Memory benchmarks measured with CodSpeed's memory instrument (eBPF
# allocation tracking: peak memory, total allocated, allocation count).
name: CodSpeed Memory

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  run:
    name: "Memory benchmarks (${{ matrix.workload }})"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        workload:
          - insert-heavy
          - read-heavy
          - mixed
          - scan-heavy
          - series-blob
          - update-churn
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel

      - name: Build memory benchmarks
        run: bazel build --config=ci-opt //perf/memory/codspeed:memory_profiles

      - name: Run memory benchmarks
        uses: CodSpeedHQ/action@v4.17.0
        env:
          CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
        with:
          mode: memory
          run: './bazel-bin/perf/memory/codspeed/memory_profiles "${{ matrix.workload }}"'
