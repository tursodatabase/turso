# Memory benchmarks measured with CodSpeed's memory instrument (eBPF
# allocation tracking: peak memory, total allocated, allocation count).
#
# The bench binary is built once, then each workload profile runs in its own
# sharded job for speed, following the pattern used by astral-sh/ruff and
# webpack (see https://codspeed.io/docs and their sharded-benchmarks docs).
# CodSpeed aggregates shards that run within the same workflow.
name: CodSpeed Memory

on:
  workflow_call:

permissions:
  contents: read
  id-token: write # required for OIDC authentication with CodSpeed

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: "1.88.0"

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-codspeed-memory"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed

      - name: Build memory benchmarks
        run: |
          set -euo pipefail
          cargo codspeed build -m memory -p memory-benchmark-codspeed --features codspeed,fts
          tar -cf - -C target codspeed | zstd -q -3 -T0 --long=31 -o codspeed-memory-benchmarks.tar.zst
          ls -lh codspeed-memory-benchmarks.tar.zst

      - name: Upload benchmark binaries
        uses: actions/upload-artifact@v4
        with:
          name: codspeed-memory-benchmarks
          path: codspeed-memory-benchmarks.tar.zst
          if-no-files-found: error
          retention-days: 1
          # Already compressed.
          compression-level: 0

  # Runs in its own job so the benchmark jobs, which wait for "build", don't
  # also wait for this test.
  test-fts:
    name: Test FTS memory workload
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: "1.88.0"

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-codspeed-memory"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test FTS memory workload
        run: cargo test -p memory-benchmark --features fts --locked

  run:
    name: "memory benchmarks (${{ matrix.name }})"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build
    timeout-minutes: 30
    # Allow this job to fail without failing the entire CI run
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # One shard per workload profile; each shard runs the WAL and MVCC
        # variants of that workload (benchmarks are named "<mode>/<workload>"
        # and the filter is a regex over benchmark names).
        # The slowest workloads are split by mode: modes starting with "w"
        # (wal) and all other modes. Together the two filters match every
        # mode, including ones added later.
        include:
          - name: insert-heavy
            filter: insert-heavy
          - name: read-heavy (wal)
            filter: "::w[^:/]*/read-heavy/"
          - name: read-heavy (other modes)
            filter: "::([^w:/][^:/]*)?/read-heavy/"
          - name: mixed (wal)
            filter: "::w[^:/]*/mixed/"
          - name: mixed (other modes)
            filter: "::([^w:/][^:/]*)?/mixed/"
          - name: scan-heavy (wal)
            filter: "::w[^:/]*/scan-heavy/"
          - name: scan-heavy (other modes)
            filter: "::([^w:/][^:/]*)?/scan-heavy/"
          - name: series-blob
            filter: series-blob
          - name: update-churn (wal)
            filter: "::w[^:/]*/update-churn/"
          - name: update-churn (other modes)
            filter: "::([^w:/][^:/]*)?/update-churn/"
          - name: fts-queries
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: "1.88.0"

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed

      - name: Download benchmark binaries
        uses: actions/download-artifact@v4
        with:
          name: codspeed-memory-benchmarks

      # tar keeps the executable bits, so no chmod is needed.
      - name: Unpack benchmark binaries
        run: |
          mkdir -p target
          zstd -q -d --long=31 -c codspeed-memory-benchmarks.tar.zst | tar -xf - -C target
          rm codspeed-memory-benchmarks.tar.zst

      - name: Run memory benchmarks
        uses: CodSpeedHQ/action@v4.17.0
        with:
          mode: memory
          # The CodSpeed runner runs this with `bash -c`; the single quotes
          # keep the filter's regex characters away from the shell.
          run: |
            if [ "${{ matrix.name }}" = "fts-queries" ]; then
              cargo codspeed run -m memory -p memory-benchmark-codspeed --bench fts_queries
            else
              cargo codspeed run -m memory -p memory-benchmark-codspeed --bench memory_profiles '${{ matrix.filter }}'
            fi
