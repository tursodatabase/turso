name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  memory:
    name: Memory benchmarks
    uses: ./.github/workflows/codspeed-memory.yml
    permissions:
      contents: read
      id-token: write

  benchmarks:
    name: "Run benchmark (${{ matrix.toolchain.name }}, ${{ matrix.benchmark.name }})"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: stable
            config: ci-opt
          - name: nightly
            config: ci-nightly-opt
        benchmark:
          - name: benchmark
            target: //core:benchmark_codspeed
            binary: bazel-bin/core/benchmark_codspeed
          - name: count_benchmark
            target: //core:count_benchmark_codspeed
            binary: bazel-bin/core/count_benchmark_codspeed
          - name: create_index_benchmark
            target: //core:create_index_benchmark_codspeed
            binary: bazel-bin/core/create_index_benchmark_codspeed
          - name: fts_benchmark
            target: //core:fts_benchmark_codspeed
            binary: bazel-bin/core/fts_benchmark_codspeed
          - name: fts_comparison_benchmark
            target: //core:fts_comparison_benchmark_codspeed
            binary: bazel-bin/core/fts_comparison_benchmark_codspeed
          - name: graph_queries_benchmark
            target: //core:graph_queries_benchmark_codspeed
            binary: bazel-bin/core/graph_queries_benchmark_codspeed
          - name: hash_spill_benchmark
            target: //core:hash_spill_benchmark_codspeed
            binary: bazel-bin/core/hash_spill_benchmark_codspeed
          - name: json_benchmark
            target: //core:json_benchmark_codspeed
            binary: bazel-bin/core/json_benchmark_codspeed
          - name: logical_log_serialization
            target: //core:logical_log_serialization_codspeed
            binary: bazel-bin/core/logical_log_serialization_codspeed
          - name: mvcc_benchmark
            target: //core:mvcc_benchmark_codspeed
            binary: bazel-bin/core/mvcc_benchmark_codspeed
          - name: mvcc_recovery_benchmark
            target: //core:mvcc_recovery_benchmark_codspeed
            binary: bazel-bin/core/mvcc_recovery_benchmark_codspeed
          - name: parser_benchmark
            target: //sqlite/parser:parser_benchmark_codspeed
            binary: bazel-bin/sqlite/parser/parser_benchmark_codspeed
          - name: prepare_benchmark
            target: //core:prepare_benchmark_codspeed
            binary: bazel-bin/core/prepare_benchmark_codspeed
          - name: prepare_params_benchmark
            target: //core:prepare_params_benchmark_codspeed
            binary: bazel-bin/core/prepare_params_benchmark_codspeed
          - name: record_recycling
            target: //core:record_recycling_codspeed
            binary: bazel-bin/core/record_recycling_codspeed
          - name: scan_loop_benchmark
            target: //core:scan_loop_benchmark_codspeed
            binary: bazel-bin/core/scan_loop_benchmark_codspeed
          - name: select_star_benchmark
            target: //core:select_star_benchmark_codspeed
            binary: bazel-bin/core/select_star_benchmark_codspeed
          - name: sql_functions
            target: //core:sql_functions_codspeed
            binary: bazel-bin/core/sql_functions_codspeed
          - name: struct_union_benchmark
            target: //core:struct_union_benchmark_codspeed
            binary: bazel-bin/core/struct_union_benchmark_codspeed
          - name: struct_union_profile
            target: //core:struct_union_profile_codspeed
            binary: bazel-bin/core/struct_union_profile_codspeed
          - name: text_validate_benchmark
            target: //core:text_validate_benchmark_codspeed
            binary: bazel-bin/core/text_validate_benchmark_codspeed
          - name: triggers
            target: //core:triggers_codspeed
            binary: bazel-bin/core/triggers_codspeed
          - name: write_perf_benchmark
            target: //core:write_perf_benchmark_codspeed
            binary: bazel-bin/core/write_perf_benchmark_codspeed
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: ./.github/actions/setup-bazel

      - name: Build benchmark
        run: bazel build --config=${{ matrix.toolchain.config }} "${{ matrix.benchmark.target }}"

      - name: Generate graph-queries DBs
        if: matrix.benchmark.name == 'graph_queries_benchmark'
        run: |
          python3 perf/graph-queries/generate_seed.py | sqlite3 perf/graph-queries/graph-queries.db
          cp perf/graph-queries/graph-queries.db perf/graph-queries/graph-queries-analyzed.db
          sqlite3 perf/graph-queries/graph-queries-analyzed.db "ANALYZE;"

      - name: Run benchmark
        uses: CodSpeedHQ/action@v4.17.0
        env:
          CODSPEED_CARGO_WORKSPACE_ROOT: ${{ github.workspace }}
        with:
          mode: simulation
          run: "./${{ matrix.benchmark.binary }}"
