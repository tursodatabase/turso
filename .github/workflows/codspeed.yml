name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  # The bench profile inherits release, which uses thin LTO. Every bench
  # target is its own binary, so the LTO step runs once per benchmark and
  # made up most of the build time. CodSpeed compares each PR against main
  # built the same way, so the comparison does not need LTO.
  CARGO_PROFILE_BENCH_LTO: "false"

jobs:
  memory:
    name: Memory benchmarks
    uses: ./.github/workflows/codspeed-memory.yml
    permissions:
      contents: read
      id-token: write

  discover:
    name: Discover benchmark shards
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      benchmarks: ${{ steps.benchmarks.outputs.benchmarks }}
      shards: ${{ steps.benchmarks.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: "1.88.0"

      - name: Resolve benchmark shards
        id: benchmarks
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t benchmarks < <(make codspeed-benchmarks-exclude-tpc-h)
          if [ "${#benchmarks[@]}" -eq 0 ]; then
            echo "No benchmarks found (excluding tpc_h_benchmark)." >&2
            exit 1
          fi

          printf 'Benchmark shards:\n'
          printf '  %s\n' "${benchmarks[@]}"

          json=$(printf '%s\n' "${benchmarks[@]}" | jq -R . | jq -cs .)
          echo "benchmarks=$json" >> "$GITHUB_OUTPUT"

          # The slowest benchmark targets run in several jobs. Each job gets
          # a filter that `cargo codspeed run` matches against every
          # benchmark's name, e.g.
          #   core/benches/fts_benchmark.rs::fts_benches::bench_fts_cold_query::FTS Cold Query::cold_query[1000_rows]
          # The filters of one target split on a single character using
          # character sets that together cover every character, so each
          # benchmark, including ones added later, runs in exactly one job.
          #   fts_benchmark: last letter of the benchmark function's name;
          #     functions ending in "n" are split again on the character
          #     before the final "]" (0-1 / anything else, incl. no "]").
          #   prepare_benchmark: the character before the final "]".
          splits='{
            "fts_benchmark": [
              "^[^:]*::[^:]*::[^:]*n::.*[01]\\]$",
              "^[^:]*::[^:]*::[^:]*n(::(.*[^01]\\]|.*[^\\]]|\\]?))?$",
              "^[^:]*::[^:]*::[^:]*e(::|$)",
              "^[^:]*::[^:]*::[^:]*[^ne:](::|$)"
            ],
            "prepare_benchmark": [
              "[0-9]\\]$",
              "([^0-9]\\]|[^\\]])$"
            ]
          }'
          shards=$(jq -c --argjson splits "$splits" '
            [.[] as $bench
              | if $splits[$bench] then
                  $splits[$bench] | to_entries[]
                  | {bench: $bench, name: "\($bench) (\(.key + 1)/\($splits[$bench] | length))", filter: .value}
                else
                  {bench: $bench, name: $bench, filter: ""}
                end]' <<< "$json")
          printf 'Benchmark jobs:\n'
          jq -r '.[] | "  \(.name)  \(.filter)"' <<< "$shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  build-stable:
    name: "Build benchmarks (stable)"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: discover
    timeout-minutes: 60
    # Allow this job to fail without failing the entire CI run
    continue-on-error: true
    outputs:
      built: ${{ steps.build_status.outputs.built }}
    env:
      TOOLCHAIN_LABEL: stable
      TOOLCHAIN_VERSION: "1.88.0"
      TOOLCHAIN_RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: ${{ env.TOOLCHAIN_VERSION }}

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust-codspeed-${{ env.TOOLCHAIN_LABEL }}"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Install cargo-codspeed
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-codspeed

      - name: Generate graph-queries DBs
        run: |
          python3 perf/graph-queries/generate_seed.py | sqlite3 perf/graph-queries/graph-queries.db
          cp perf/graph-queries/graph-queries.db perf/graph-queries/graph-queries-analyzed.db
          sqlite3 perf/graph-queries/graph-queries-analyzed.db "ANALYZE;"

      - name: Build benchmarks (excluding TPC-H)
        id: build_benchmarks
        env:
          BENCHMARKS_JSON: ${{ needs.discover.outputs.benchmarks }}
          RUSTFLAGS: ${{ env.TOOLCHAIN_RUSTFLAGS }}
        shell: bash
        run: |
          set -euo pipefail

          bench_args=$(jq -r '.[] | "--bench " + .' <<< "$BENCHMARKS_JSON" | tr '\n' ' ')
          cargo +${{ env.TOOLCHAIN_VERSION }} codspeed build -m simulation $bench_args --features codspeed

          # Every bench binary contains its own copy of turso_core, so the
          # binaries are mostly the same bytes. A zip compresses each file
          # on its own (~2 GB); zstd with long-distance matching stores the
          # shared parts once. Every benchmark job downloads this archive.
          tar -cf - -C target codspeed | zstd -q -3 -T0 --long=31 -o codspeed-benchmarks.tar.zst
          ls -lh codspeed-benchmarks.tar.zst

      - name: Upload benchmark binaries
        id: upload_artifact
        if: steps.build_benchmarks.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codspeed-benchmarks-${{ env.TOOLCHAIN_LABEL }}
          path: codspeed-benchmarks.tar.zst
          if-no-files-found: error
          retention-days: 1
          # Already compressed.
          compression-level: 0

      - name: Record build status
        id: build_status
        if: always()
        run: echo "built=${{ steps.build_benchmarks.outcome == 'success' && steps.upload_artifact.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

  build-nightly:
    name: "Build benchmarks (nightly)"
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: discover
    timeout-minutes: 60
    # Allow this job to fail without failing the entire CI run
    continue-on-error: true
    outputs:
      built: ${{ steps.build_status.outputs.built }}
    env:
      TOOLCHAIN_LABEL: nightly
      TOOLCHAIN_VERSION: "nightly-2025-12-17"
      TOOLCHAIN_RUSTFLAGS: "--cfg nightly"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: ${{ env.TOOLCHAIN_VERSION }}

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust-codspeed-${{ env.TOOLCHAIN_LABEL }}"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Install cargo-codspeed
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-codspeed

      - name: Generate graph-queries DBs
        run: |
          python3 perf/graph-queries/generate_seed.py | sqlite3 perf/graph-queries/graph-queries.db
          cp perf/graph-queries/graph-queries.db perf/graph-queries/graph-queries-analyzed.db
          sqlite3 perf/graph-queries/graph-queries-analyzed.db "ANALYZE;"

      - name: Build benchmarks (excluding TPC-H)
        id: build_benchmarks
        env:
          BENCHMARKS_JSON: ${{ needs.discover.outputs.benchmarks }}
          RUSTFLAGS: ${{ env.TOOLCHAIN_RUSTFLAGS }}
        shell: bash
        run: |
          set -euo pipefail

          bench_args=$(jq -r '.[] | "--bench " + .' <<< "$BENCHMARKS_JSON" | tr '\n' ' ')
          cargo +${{ env.TOOLCHAIN_VERSION }} codspeed build -m simulation $bench_args --features codspeed

          # Every bench binary contains its own copy of turso_core, so the
          # binaries are mostly the same bytes. A zip compresses each file
          # on its own (~2 GB); zstd with long-distance matching stores the
          # shared parts once. Every benchmark job downloads this archive.
          tar -cf - -C target codspeed | zstd -q -3 -T0 --long=31 -o codspeed-benchmarks.tar.zst
          ls -lh codspeed-benchmarks.tar.zst

      - name: Upload benchmark binaries
        id: upload_artifact
        if: steps.build_benchmarks.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codspeed-benchmarks-${{ env.TOOLCHAIN_LABEL }}
          path: codspeed-benchmarks.tar.zst
          if-no-files-found: error
          retention-days: 1
          # Already compressed.
          compression-level: 0

      - name: Record build status
        id: build_status
        if: always()
        run: echo "built=${{ steps.build_benchmarks.outcome == 'success' && steps.upload_artifact.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

  benchmarks-stable:
    name: "Run benchmark (stable, ${{ matrix.shard.name }})"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - discover
      - build-stable
    if: needs.build-stable.outputs.built == 'true'
    timeout-minutes: 30
    # Allow this job to fail without failing the entire CI run
    continue-on-error: true
    env:
      TOOLCHAIN_VERSION: "1.88.0"
      TOOLCHAIN_LABEL: stable
      TOOLCHAIN_RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.discover.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: ${{ env.TOOLCHAIN_VERSION }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-codspeed

      - name: Download benchmark binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codspeed-benchmarks-${{ env.TOOLCHAIN_LABEL }}

      # tar keeps the executable bits, so no chmod is needed.
      - name: Unpack benchmark binaries
        run: |
          mkdir -p target
          zstd -q -d --long=31 -c codspeed-benchmarks.tar.zst | tar -xf - -C target
          rm codspeed-benchmarks.tar.zst

      - name: Generate graph-queries DBs
        if: matrix.shard.bench == 'graph_queries_benchmark'
        run: |
          python3 perf/graph-queries/generate_seed.py | sqlite3 perf/graph-queries/graph-queries.db
          cp perf/graph-queries/graph-queries.db perf/graph-queries/graph-queries-analyzed.db
          sqlite3 perf/graph-queries/graph-queries-analyzed.db "ANALYZE;"

      - name: Run benchmarks (excluding TPC-H)
        uses: CodSpeedHQ/action@9d332c4d90b43981c3e55ae8e38e68709996240f # v4.17.0
        env:
          RUSTFLAGS: ${{ env.TOOLCHAIN_RUSTFLAGS }}
        with:
          mode: simulation
          # The CodSpeed runner runs this line with `bash -c`, so the quotes
          # keep the filter's regex characters away from the shell.
          run: cargo +${{ env.TOOLCHAIN_VERSION }} codspeed run ${{ matrix.shard.filter != '' && format('''{0}''', matrix.shard.filter) || '' }} --bench ${{ matrix.shard.bench }}

  benchmarks-nightly:
    name: "Run benchmark (nightly, ${{ matrix.shard.name }})"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - discover
      - build-nightly
    if: needs.build-nightly.outputs.built == 'true'
    timeout-minutes: 30
    # Allow this job to fail without failing the entire CI run
    continue-on-error: true
    env:
      TOOLCHAIN_VERSION: "nightly-2025-12-17"
      TOOLCHAIN_LABEL: nightly
      TOOLCHAIN_RUSTFLAGS: "--cfg nightly"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.discover.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: ${{ env.TOOLCHAIN_VERSION }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-codspeed

      - name: Download benchmark binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codspeed-benchmarks-${{ env.TOOLCHAIN_LABEL }}

      # tar keeps the executable bits, so no chmod is needed.
      - name: Unpack benchmark binaries
        run: |
          mkdir -p target
          zstd -q -d --long=31 -c codspeed-benchmarks.tar.zst | tar -xf - -C target
          rm codspeed-benchmarks.tar.zst

      - name: Generate graph-queries DBs
        if: matrix.shard.bench == 'graph_queries_benchmark'
        run: |
          python3 perf/graph-queries/generate_seed.py | sqlite3 perf/graph-queries/graph-queries.db
          cp perf/graph-queries/graph-queries.db perf/graph-queries/graph-queries-analyzed.db
          sqlite3 perf/graph-queries/graph-queries-analyzed.db "ANALYZE;"

      - name: Run benchmarks (excluding TPC-H)
        uses: CodSpeedHQ/action@9d332c4d90b43981c3e55ae8e38e68709996240f # v4.17.0
        env:
          RUSTFLAGS: ${{ env.TOOLCHAIN_RUSTFLAGS }}
        with:
          mode: simulation
          # The CodSpeed runner runs this line with `bash -c`, so the quotes
          # keep the filter's regex characters away from the shell.
          run: cargo +${{ env.TOOLCHAIN_VERSION }} codspeed run ${{ matrix.shard.filter != '' && format('''{0}''', matrix.shard.filter) || '' }} --bench ${{ matrix.shard.bench }}

