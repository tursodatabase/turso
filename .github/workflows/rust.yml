name: Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  rustfmt:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Check formatting
        run: bazel build //... --aspects=@rules_rust//rust:defs.bzl%rustfmt_aspect --output_groups=rustfmt_checks --lockfile_mode=error

  clippy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Clippy
        run: bazel build //... --aspects=@rules_rust//rust:defs.bzl%rust_clippy_aspect --output_groups=clippy_checks --lockfile_mode=error

  build-native:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-latest
          - blacksmith-8vcpu-windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: ./.github/actions/setup-bazel
      - name: Install SQLite
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install sqlite3:x64-windows-static-md
      - name: Build Rust targets
        if: runner.os != 'Windows'
        run: bazel build //... --lockfile_mode=error
      - name: Build Rust targets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sqliteLibDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md\lib"
          if (-not (Test-Path "$sqliteLibDir\sqlite3.lib")) {
            throw "SQLite library not found at $sqliteLibDir\sqlite3.lib"
          }
          bazel build //... "--@rules_rust//rust/settings:extra_rustc_flag=-Clink-arg=/LIBPATH:$sqliteLibDir" --lockfile_mode=error

  core-tests:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Run sharded core tests
        run: bazel test //core:turso_core_test_sharded --test_output=errors --lockfile_mode=error --jobs=8

  integration-tests:
    name: Tests (${{ matrix.target }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - //tests:core_tester_test
          - //tests:integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - run: bazel test ${{ matrix.target }} --test_output=errors --lockfile_mode=error

  workspace-tests:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Run remaining Rust tests
        run: |
          bazel test \
            //bindings/... //cli/... //extensions/... //sdk-kit/... \
            //sync/... //serverless/rust/... //testing/... \
            --test_output=errors --lockfile_mode=error --jobs=8

  simulator:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            iterations: 10
            args: --maximum-tests 1000 --min-tick 10 --max-tick 50 --io-backend=memory
          - name: write-heavy
            iterations: 5
            args: --maximum-tests 1000 --profile write_heavy --io-backend=memory
          - name: differential
            iterations: 10
            args: --maximum-tests 1000 --differential --io-backend=memory
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Build simulator
        run: bazel build //testing/simulator:limbo_sim --lockfile_mode=error
      - name: Simulator ${{ matrix.name }}
        run: |
          for i in $(seq 1 ${{ matrix.iterations }}); do
            bazel-bin/testing/simulator/limbo_sim ${{ matrix.args }} || exit 1
          done

  differential-fuzzer:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [balanced, ddl, triggers, writes, correlated-subqueries]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Build differential fuzzer
        run: bazel build //testing/differential-oracle/fuzzer:differential_fuzzer --lockfile_mode=error
      - name: Run fixed seeds
        run: |
          for seed in 1 2 3 4 5 6; do
            bazel-bin/testing/differential-oracle/fuzzer/differential_fuzzer \
              --seed "$seed" --profile ${{ matrix.profile }} -n 1000
          done

  concurrent-simulator:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: in-process
            iterations: 100
            args: --mode fast --reopen-probability 0.001
          - name: in-process-mvcc
            iterations: 25
            args: --mode fast --enable-mvcc --allocation-fault-probability 0.01
          - name: multiprocess
            iterations: 10
            args: --mode fast --multiprocess --connections-per-process 4 --processes 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Regression tests
        if: matrix.name == 'in-process'
        run: bazel test //testing/concurrent-simulator:regression_tests --test_output=errors --lockfile_mode=error
      - name: Build whopper
        run: bazel build //testing/concurrent-simulator:turso_whopper --define=core_checksum=true --lockfile_mode=error
      - name: Run whopper
        env:
          WHOPPER_ARGS: ${{ matrix.args }}
        run: |
          seq 1 ${{ matrix.iterations }} | xargs -P 4 -n 1 bash -c '
            bazel-bin/testing/concurrent-simulator/turso_whopper $WHOPPER_ARGS
          ' _
