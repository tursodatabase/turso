name: Python

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  working-directory: bindings/python
  PIP_DISABLE_PIP_VERSION_CHECK: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: 10
  # Blacksmith Windows images ship VS Build Tools without LLVM, so the aegis
  # crate's clang-cl preference fails; force the MSVC compiler instead.
  CC_x86_64_pc_windows_msvc: cl.exe
  # Wheels are only published from tags. Pull requests only check that the
  # wheels build, so they use lib-release (no LTO) instead of the slow
  # release-official profile.
  WHEEL_PROFILE: ${{ github.event_name == 'pull_request' && 'lib-release' || 'release-official' }}

jobs:
  test:
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-latest
          - blacksmith-8vcpu-windows-2025
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: "./.github/shared/setup-msvc"

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Build Rust (debug)
        run: cargo build -p turso_cli --bin tursodb --locked

      - name: Set up Python ${{ matrix.python-version }}
        uses: useblacksmith/setup-python@943b05a7c4ca70c2360391137527a37bee33fb1d # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: useblacksmith/setup-uv@f4588471335f14dcb60198856207b916701a9e9f # v4
        with:
          enable-cache: true

      # `uv sync` builds the extension with maturin, which defaults to an
      # optimized release build with LTO. On pull requests, build it in debug
      # mode instead: much faster, and it reuses what "Build Rust (debug)"
      # built. main keeps testing the release build, which has code paths
      # debug builds don't (e.g. panic=abort, release-only branches).
      - name: Build the extension in debug mode on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo "MATURIN_PEP517_ARGS=--profile dev" >> "$GITHUB_ENV"

      - name: Install the project
        working-directory: ${{ env.working-directory }}
        run: uv sync --all-extras --dev --all-packages

      - name: Run Pytest
        working-directory: ${{ env.working-directory }}
        run: uv run pytest tests/test_database.py

      - name: Run Pytest (async driver)
        working-directory: ${{ env.working-directory }}
        run: uv run pytest tests/test_database_aio.py

      - name: Run Pytest (sync)
        working-directory: ${{ env.working-directory }}
        if: runner.os != 'Windows'
        env:
          LOCAL_SYNC_SERVER: "../../target/debug/tursodb"
        run: uv run pytest tests/test_database_sync.py --durations=10

      - name: Run Pytest (sync, async driver)
        working-directory: ${{ env.working-directory }}
        if: runner.os != 'Windows'
        env:
          LOCAL_SYNC_SERVER: "../../target/debug/tursodb"
        run: uv run pytest tests/test_database_sync_aio.py --durations=10

      - name: Run Pytest (windows, sync drivers)
        working-directory: ${{ env.working-directory }}
        if: runner.os == 'Windows'
        shell: bash
        env:
          LOCAL_SYNC_SERVER: "..\\..\\target\\debug\\tursodb.exe"
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/test_database_sync.py --durations=10 >sync.log 2>&1 &
          sync_pid=$!
          uv run --no-sync pytest tests/test_database_sync_aio.py --durations=10 >async.log 2>&1 &
          async_pid=$!
          sync_status=0
          wait "$sync_pid" || sync_status=$?
          async_status=0
          wait "$async_pid" || async_status=$?
          cat sync.log
          cat async.log
          if [ "$sync_status" -ne 0 ] || [ "$async_status" -ne 0 ]; then
            exit 1
          fi

  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: useblacksmith/setup-python@943b05a7c4ca70c2360391137527a37bee33fb1d # v6

      - name: Install uv
        uses: useblacksmith/setup-uv@f4588471335f14dcb60198856207b916701a9e9f # v4
        with:
          enable-cache: true

      - name: Ruff lint
        run: uvx ruff@0.5.4 check

  linux:
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: blacksmith-4vcpu-ubuntu-2404
          - target: aarch64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: useblacksmith/setup-python@943b05a7c4ca70c2360391137527a37bee33fb1d # v6
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ env.working-directory }}
          target: ${{ matrix.target }}
          args: --profile ${{ env.WHEEL_PROFILE }} --out dist
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-linux-${{ matrix.target }}
          path: bindings/python/dist

  macos:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    strategy:
      matrix:
        # On pull requests, skip the aarch64 wheel: the macOS test job
        # already builds the same extension for aarch64 (uv sync builds a
        # wheel through maturin) and runs the tests against it. x86_64 is
        # the only PR build for that target, so it stays.
        target: ${{ github.event_name == 'pull_request' && fromJSON('["x86_64"]') || fromJSON('["x86_64", "aarch64"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        env:
          CXX: clang++
          CC: clang
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ env.working-directory }}
          target: ${{ matrix.target }}
          args: --profile ${{ env.WHEEL_PROFILE }} --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-macos-${{ matrix.target }}
          path: bindings/python/dist

  sdist:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ env.working-directory }}
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: bindings/python/dist

  release:
    name: Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, macos, sdist]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/python/dist
          pattern: wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          working-directory: ${{ env.working-directory }}
          command: upload
          args: --skip-existing dist/*
