name: Rust Benchmarks

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "notmain"]

jobs:
  bench:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - bench: benchmark
            target: //core:benchmark
          - bench: mvcc_benchmark
            target: //core:mvcc_benchmark
          - bench: json_benchmark
            target: //core:json_benchmark
          - bench: sql_functions
            target: //core:sql_functions
          - bench: hash_spill_benchmark
            target: //core:hash_spill_benchmark
          - bench: write_perf_benchmark
            target: //core:write_perf_benchmark
          - bench: fts_benchmark
            target: //core:fts_benchmark
          - bench: parser_benchmark
            target: //sqlite/parser:parser_benchmark
          - bench: graph_queries_benchmark
            target: //core:graph_queries_benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Generate graph-queries DB
        if: matrix.bench == 'graph_queries_benchmark'
        run: |
          python3 perf/graph-queries/generate_seed.py | sqlite3 perf/graph-queries/graph-queries.db
          cp perf/graph-queries/graph-queries.db perf/graph-queries/graph-queries-analyzed.db
          sqlite3 perf/graph-queries/graph-queries-analyzed.db "ANALYZE;"
      - name: Bench ${{ matrix.bench }}
        run: bazel run --config=ci-opt "${{ matrix.target }}"

  clickbench:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 24

      - name: Build tursodb
        run: |
          bazel build -c opt //cli:tursodb
          mkdir -p target/release
          ln -sf "$(pwd)/bazel-bin/cli/tursodb" target/release/tursodb

      - name: Clickbench
        run: make clickbench

  tpc-h-criterion:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      DB_FILE: "perf/tpc-h/TPC-H.db"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel

      - name: Cache TPC-H
        id: cache-primes
        uses: useblacksmith/cache@v5
        with:
          path: ${{ env.DB_FILE }}
          key: tpc-h
      - name: Download TPC-H
        if: steps.cache-primes.outputs.cache-hit != 'true'
        env:
          DB_URL: "https://github.com/lovasoa/TPCH-sqlite/releases/download/v1.0/TPC-H.db"
        run: wget -O $DB_FILE --no-verbose $DB_URL

      - name: Bench
        run: bazel run --config=ci-opt //core:tpc_h_benchmark

  tpc-h:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Build tursodb
        run: |
          bazel build -c opt //cli:tursodb
          mkdir -p target/release
          ln -sf "$(pwd)/bazel-bin/cli/tursodb" target/release/tursodb
      - name: TPC-H
        env:
          RUST_LOG: "off"
        run: ./perf/tpc-h/benchmark.sh

  vfs-bench-compile:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel

      - name: Build
        run: |
          bazel build -c opt //cli:tursodb
          mkdir -p target/release
          ln -sf "$(pwd)/bazel-bin/cli/tursodb" target/release/tursodb

      - name: Install uv
        uses: useblacksmith/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --package turso_test

      - name: Run benchmark
        run: uv run bench-vfs "SELECT 1;" 100
