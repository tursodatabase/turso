name: Build & publish @tursodatabase/database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

env:
  DEBUG: napi:*
  APP_NAME: turso
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: 10
  # Blacksmith Windows images ship VS Build Tools without LLVM, so the aegis
  # crate's clang-cl preference fails; force the MSVC compiler instead.
  CC_x86_64_pc_windows_msvc: cl.exe

defaults:
  run:
    working-directory: bindings/javascript

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: blacksmith-8vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            artifact: db-bindings-x86_64-pc-windows-msvc
            build: yarn workspace @tursodatabase/database napi-build --target x86_64-pc-windows-msvc
          - host: blacksmith-8vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            artifact: sync-bindings-x86_64-pc-windows-msvc
            build: yarn workspace @tursodatabase/sync napi-build --target x86_64-pc-windows-msvc
          - host: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            artifact: db-bindings-x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            build: yarn workspace @tursodatabase/database napi-build --target x86_64-unknown-linux-gnu
          - host: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            artifact: sync-bindings-x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            build: yarn workspace @tursodatabase/sync napi-build --target x86_64-unknown-linux-gnu
          - host: blacksmith-6vcpu-macos-latest
            target: aarch64-apple-darwin
            artifact: db-bindings-aarch64-apple-darwin
            build: yarn workspace @tursodatabase/database napi-build --target aarch64-apple-darwin
          - host: blacksmith-6vcpu-macos-latest
            target: aarch64-apple-darwin
            artifact: sync-bindings-aarch64-apple-darwin
            build: yarn workspace @tursodatabase/sync napi-build --target aarch64-apple-darwin
          - host: blacksmith-8vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-gnu
            artifact: db-bindings-aarch64-unknown-linux-gnu
            build: yarn workspace @tursodatabase/database napi-build --target aarch64-unknown-linux-gnu
          - host: blacksmith-8vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-gnu
            artifact: sync-bindings-aarch64-unknown-linux-gnu
            build: yarn workspace @tursodatabase/sync napi-build --target aarch64-unknown-linux-gnu
          - host: blacksmith-4vcpu-ubuntu-2404
            target: wasm32-wasip1-threads
            artifact: db-bindings-wasm32-wasip1-threads
            setup: |
              rustup target add wasm32-wasip1-threads
              wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
              tar -xvf wasi-sdk-25.0-x86_64-linux.tar.gz
            build: |
              export WASI_SDK_PATH="$(pwd)/wasi-sdk-25.0-x86_64-linux"
              export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
              export TARGET_CXXFLAGS="--target=wasm32-wasi-threads --sysroot=$(pwd)/wasi-sdk-25.0-x86_64-linux/share/wasi-sysroot -pthread -mllvm -wasm-enable-sjlj -lsetjmp"
              export TARGET_CFLAGS="$TARGET_CXXFLAGS"
              yarn workspace @tursodatabase/database-common build
              yarn workspace @tursodatabase/database-wasm-common build
              yarn workspace @tursodatabase/database-wasm build
          - host: blacksmith-4vcpu-ubuntu-2404
            target: wasm32-wasip1-threads
            artifact: sync-bindings-wasm32-wasip1-threads
            setup: |
              rustup target add wasm32-wasip1-threads
              wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
              tar -xvf wasi-sdk-25.0-x86_64-linux.tar.gz
            build: |
              export WASI_SDK_PATH="$(pwd)/wasi-sdk-25.0-x86_64-linux"
              export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
              export TARGET_CXXFLAGS="--target=wasm32-wasi-threads --sysroot=$(pwd)/wasi-sdk-25.0-x86_64-linux/share/wasi-sysroot -pthread -mllvm -wasm-enable-sjlj -lsetjmp"
              export TARGET_CFLAGS="$TARGET_CXXFLAGS"
              yarn workspace @tursodatabase/database-common build
              yarn workspace @tursodatabase/database-wasm-common build
              yarn workspace @tursodatabase/sync-common build
              yarn workspace @tursodatabase/sync-wasm build
        # On pull requests, skip the macOS builds: no test job uses their
        # output (tests run on Linux, Windows and in the browser), and the
        # Rust workflow's macOS build-native job already compiles both napi
        # crates. main and tags still build them for publishing.
        event: ["${{ github.event_name }}"]
        exclude:
          - event: pull_request
            settings:
              host: blacksmith-6vcpu-macos-latest
              target: aarch64-apple-darwin
              artifact: db-bindings-aarch64-apple-darwin
              build: yarn workspace @tursodatabase/database napi-build --target aarch64-apple-darwin
          - event: pull_request
            settings:
              host: blacksmith-6vcpu-macos-latest
              target: aarch64-apple-darwin
              artifact: sync-bindings-aarch64-apple-darwin
              build: yarn workspace @tursodatabase/sync napi-build --target aarch64-apple-darwin
    name: ${{ matrix.settings.artifact }} - node@24
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 24
      - name: Install
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: "./.github/shared/setup-msvc"
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' || matrix.settings.target == 'armv7-unknown-linux-musleabihf' }}
        with:
          version: 0.13.0
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      # release-official uses full LTO with one codegen unit, which is what we
      # publish but makes each build several times slower. Pull requests only
      # need to know that the bindings build and pass tests.
      - name: Use a faster build profile on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_OFFICIAL_LTO=false" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_OFFICIAL_CODEGEN_UNITS=16" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Setup node x86
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: matrix.settings.target == 'x86_64-pc-windows-msvc'
        with:
          node-version: 24
          architecture: x64
      - name: Build in docker
        if: ${{ matrix.settings.docker }}
        shell: bash
        working-directory: .
        run: |
          docker run --rm --user 0:0 \
            -e CARGO_PROFILE_RELEASE_OFFICIAL_LTO \
            -e CARGO_PROFILE_RELEASE_OFFICIAL_CODEGEN_UNITS \
            -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db \
            -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache \
            -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index \
            -v ${{ github.workspace }}:/build \
            -w /build/bindings/javascript \
            ${{ matrix.settings.docker }} \
            bash -c "${{ matrix.settings.build }}"
      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ !matrix.settings.docker }}
        shell: bash
      # The release profile keeps debug info, which on Linux is embedded in the
      # .node file itself (~80% of its size). macOS and Windows keep debug info
      # in separate files, so only Linux needs stripping.
      - name: Strip debug info
        if: ${{ contains(matrix.settings.target, 'unknown-linux-gnu') }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(packages/native/turso.*.node sync/packages/native/sync.*.node)
          # Docker builds run as root, leaving the outputs unwritable for the
          # runner user, and strip rewrites the file in place.
          sudo chown "$(id -u):$(id -g)" "${files[@]}"
          strip "${files[@]}"
          ls -la "${files[@]}"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.settings.artifact }}
          path: |
            bindings/javascript/packages/native/turso.*.node
            bindings/javascript/packages/wasm/turso.*.wasm
            bindings/javascript/sync/packages/native/sync.*.node
            bindings/javascript/sync/packages/wasm/sync.*.wasm
          if-no-files-found: error
  test-db-linux-x64-gnu-binding:
    name: Test DB bindings on Linux-x64-gnu - node@${{ matrix.node }}
    timeout-minutes: 30
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup node
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'db*'
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: docker run --rm -v $(pwd):/build -w /build node:${{ matrix.node }}-slim yarn workspace @tursodatabase/database test
  test-db-windows-x64-msvc-binding:
    name: Test DB bindings on Windows-x64-msvc - node@${{ matrix.node }}
    timeout-minutes: 30
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'db*'
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: yarn workspace @tursodatabase/database test
  test-db-wasm-binding:
    name: Test DB bindings on browser
    timeout-minutes: 30
    needs:
      - build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Image ships node 20 + chromium + firefox + system deps. Bump the tag
    # whenever the `playwright` dep in bindings/javascript/yarn.lock changes.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    # GitHub mounts /github/home (uid 1001) as $HOME, but the image runs as
    # root — Firefox refuses to launch unless HOME is root-owned.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Build wasm-common
        run: yarn workspace @tursodatabase/database-wasm-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'db*'
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: yarn workspace @tursodatabase/database-wasm test
  test-sync-linux-x64-gnu-binding:
    name: Test sync bindings on Linux-x64-gnu - node@${{ matrix.node }}
    timeout-minutes: 30
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup node
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        with:
          node-version: ${{ matrix.node }}
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tursodb
        working-directory: .
        run: cargo build --bin tursodb --locked
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Build sync common
        run: yarn workspace @tursodatabase/sync-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'db*'
      - name: Download all sync artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'sync*'
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        env:
          LOCAL_SYNC_SERVER: ${{ github.workspace }}/target/debug/tursodb
        run: yarn workspace @tursodatabase/sync test
  test-sync-windows-x64-msvc-binding:
    name: Test sync bindings on Windows-x64-msvc - node@${{ matrix.node }}
    timeout-minutes: 45
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    # Each job builds tursodb (the local sync server) before testing; the
    # larger runner shortens that build, which set the end of the workflow.
    runs-on: blacksmith-8vcpu-windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Setup MSVC
        uses: "./.github/shared/setup-msvc"
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tursodb
        working-directory: .
        run: cargo build --bin tursodb --locked
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Build sync common
        run: yarn workspace @tursodatabase/sync-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'db*'
      - name: Download all sync artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'sync*'
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        env:
          LOCAL_SYNC_SERVER: ${{ github.workspace }}/target/debug/tursodb
        run: yarn workspace @tursodatabase/sync test
  test-sync-wasm-binding:
    name: Test sync bindings on browser
    timeout-minutes: 30
    needs:
      - build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Image ships node 20 + chromium + firefox + system deps. Bump the tag
    # whenever the `playwright` dep in bindings/javascript/yarn.lock changes.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    # GitHub mounts /github/home (uid 1001) as $HOME, but the image runs as
    # root — Firefox refuses to launch unless HOME is root-owned.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install build toolchain
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tursodb
        working-directory: .
        run: cargo build --bin tursodb --locked
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Build wasm-common
        run: yarn workspace @tursodatabase/database-wasm-common build
      - name: Build sync common
        run: yarn workspace @tursodatabase/sync-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'db*'
      - name: Download all sync artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'sync*'
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        env:
          LOCAL_SYNC_SERVER: ${{ github.workspace }}/target/debug/tursodb
        run: yarn workspace @tursodatabase/sync-wasm test
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    needs:
      - test-db-linux-x64-gnu-binding
      - test-db-windows-x64-msvc-binding
      - test-db-wasm-binding
      - test-sync-linux-x64-gnu-binding
      - test-sync-windows-x64-msvc-binding
      - test-sync-wasm-binding
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Update npm
        run: npm install -g npm@11
      - name: Download all DB artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'db*'
      - name: Download all sync artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: 'sync*'
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Install dependencies
        run: yarn install
      - name: Install dependencies
        run: yarn tsc-build
      - name: Publish
        if: "startsWith(github.ref, 'refs/tags/v')"
        run: |
          if git log -1 --pretty=%B | grep "^Turso [0-9]\+\.[0-9]\+\.[0-9]\+$";
          then
            npm publish --workspaces --access public --provenance
          elif git log -1 --pretty=%B | grep "^Turso [0-9]\+\.[0-9]\+\.[0-9]\+";
          then
            npm publish --workspaces --access public --provenance --tag next
          else
            echo "git log structure is unexpected, skip publishing"
            npm publish --workspaces --dry-run
          fi
      - name: Publish (dry-run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          npm pack --workspaces
