name: Build & publish @tursodatabase/database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

env:
  DEBUG: napi:*
  APP_NAME: turso
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  # Blacksmith Windows images ship VS Build Tools without LLVM, so the aegis
  # crate's clang-cl preference fails; force the MSVC compiler instead.
  CC_x86_64_pc_windows_msvc: cl.exe

defaults:
  run:
    working-directory: bindings/javascript

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            artifact: db-bindings-x86_64-pc-windows-msvc
            bazel_target: //bindings/javascript:turso_node_cdylib
            bazel_output: bazel-bin/bindings/javascript/turso_node.dll
            destination: bindings/javascript/packages/native/turso.win32-x64-msvc.node
          - host: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            artifact: sync-bindings-x86_64-pc-windows-msvc
            bazel_target: //bindings/javascript/sync:turso_sync_js_cdylib
            bazel_output: bazel-bin/bindings/javascript/sync/turso_sync_js.dll
            destination: bindings/javascript/sync/packages/native/sync.win32-x64-msvc.node
          - host: blacksmith-4vcpu-ubuntu-2204
            target: x86_64-unknown-linux-gnu
            artifact: db-bindings-x86_64-unknown-linux-gnu
            bazel_target: //bindings/javascript:turso_node_cdylib
            bazel_output: bazel-bin/bindings/javascript/libturso_node.so
            destination: bindings/javascript/packages/native/turso.linux-x64-gnu.node
          - host: blacksmith-4vcpu-ubuntu-2204
            target: x86_64-unknown-linux-gnu
            artifact: sync-bindings-x86_64-unknown-linux-gnu
            bazel_target: //bindings/javascript/sync:turso_sync_js_cdylib
            bazel_output: bazel-bin/bindings/javascript/sync/libturso_sync_js.so
            destination: bindings/javascript/sync/packages/native/sync.linux-x64-gnu.node
          - host: blacksmith-6vcpu-macos-latest
            target: aarch64-apple-darwin
            artifact: db-bindings-aarch64-apple-darwin
            bazel_target: //bindings/javascript:turso_node_cdylib
            bazel_output: bazel-bin/bindings/javascript/libturso_node.dylib
            destination: bindings/javascript/packages/native/turso.darwin-arm64.node
          - host: blacksmith-6vcpu-macos-latest
            target: aarch64-apple-darwin
            artifact: sync-bindings-aarch64-apple-darwin
            bazel_target: //bindings/javascript/sync:turso_sync_js_cdylib
            bazel_output: bazel-bin/bindings/javascript/sync/libturso_sync_js.dylib
            destination: bindings/javascript/sync/packages/native/sync.darwin-arm64.node
          - host: blacksmith-2vcpu-ubuntu-2204-arm
            target: aarch64-unknown-linux-gnu
            artifact: db-bindings-aarch64-unknown-linux-gnu
            bazel_target: //bindings/javascript:turso_node_cdylib
            bazel_output: bazel-bin/bindings/javascript/libturso_node.so
            destination: bindings/javascript/packages/native/turso.linux-arm64-gnu.node
          - host: blacksmith-2vcpu-ubuntu-2204-arm
            target: aarch64-unknown-linux-gnu
            artifact: sync-bindings-aarch64-unknown-linux-gnu
            bazel_target: //bindings/javascript/sync:turso_sync_js_cdylib
            bazel_output: bazel-bin/bindings/javascript/sync/libturso_sync_js.so
            destination: bindings/javascript/sync/packages/native/sync.linux-arm64-gnu.node
          - host: blacksmith-4vcpu-ubuntu-2404
            target: wasm32-wasip1-threads
            artifact: db-bindings-wasm32-wasip1-threads
            bazel_target: //bindings/javascript:turso_node_wasm
            bazel_output: bazel-bin/bindings/javascript/turso_node.wasm
            destination: bindings/javascript/packages/wasm/turso.wasm32-wasi.wasm
            build: |
              bazel build --config=ci-opt --platforms=//:wasm32_wasip1_threads //bindings/javascript:turso_node_wasm
              install -m 0644 bazel-bin/bindings/javascript/turso_node.wasm bindings/javascript/packages/wasm/turso.wasm32-wasi.wasm
              cd bindings/javascript
              npm run build --workspace=packages/wasm-common
              npm run tsc-build --workspace=packages/wasm
          - host: blacksmith-4vcpu-ubuntu-2404
            target: wasm32-wasip1-threads
            artifact: sync-bindings-wasm32-wasip1-threads
            bazel_target: //bindings/javascript/sync:turso_sync_js_wasm
            bazel_output: bazel-bin/bindings/javascript/sync/turso_sync_js.wasm
            destination: bindings/javascript/sync/packages/wasm/sync.wasm32-wasi.wasm
            build: |
              bazel build --config=ci-opt --platforms=//:wasm32_wasip1_threads //bindings/javascript/sync:turso_sync_js_wasm
              install -m 0644 bazel-bin/bindings/javascript/sync/turso_sync_js.wasm bindings/javascript/sync/packages/wasm/sync.wasm32-wasi.wasm
              cd bindings/javascript
              npm run build --workspace=packages/wasm-common
              npm run build --workspace=sync/packages/common
              npm run tsc-build --workspace=sync/packages/wasm
    name: ${{ matrix.settings.artifact }} - node@24
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bazel
      - uses: mlugg/setup-zig@v2
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' || matrix.settings.target == 'armv7-unknown-linux-musleabihf' }}
        with:
          version: 0.13.0
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Setup node x86
        uses: actions/setup-node@v5
        if: matrix.settings.target == 'x86_64-pc-windows-msvc'
        with:
          node-version: 24
          architecture: x64
      - name: Build native module
        if: ${{ matrix.settings.target != 'wasm32-wasip1-threads' }}
        working-directory: .
        shell: bash
        run: |
          bazel build ${{ matrix.settings.bazel_target }}
          install -m 0644 "${{ matrix.settings.bazel_output }}" "${{ matrix.settings.destination }}"
      - name: Build WASM module
        run: ${{ matrix.settings.build }}
        if: ${{ matrix.settings.target == 'wasm32-wasip1-threads' }}
        working-directory: .
        shell: bash
      # The release profile keeps debug info, which on Linux is embedded in the
      # .node file itself (~80% of its size). macOS and Windows keep debug info
      # in separate files, so only Linux needs stripping.
      - name: Strip debug info
        if: ${{ contains(matrix.settings.target, 'unknown-linux-gnu') }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(packages/native/turso.*.node sync/packages/native/sync.*.node)
          sudo chown "$(id -u):$(id -g)" "${files[@]}"
          strip "${files[@]}"
          ls -la "${files[@]}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.settings.artifact }}
          path: |
            bindings/javascript/packages/native/turso.*.node
            bindings/javascript/packages/wasm/turso.*.wasm
            bindings/javascript/sync/packages/native/sync.*.node
            bindings/javascript/sync/packages/wasm/sync.*.wasm
          if-no-files-found: error
  test-db-linux-x64-gnu-binding:
    name: Test DB bindings on Linux-x64-gnu - node@${{ matrix.node }}
    timeout-minutes: 30
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: useblacksmith/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "db*"
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: docker run --rm -v $(pwd):/build -w /build node:${{ matrix.node }}-slim yarn workspace @tursodatabase/database test
  test-db-windows-x64-msvc-binding:
    name: Test DB bindings on Windows-x64-msvc - node@${{ matrix.node }}
    timeout-minutes: 30
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "db*"
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: yarn workspace @tursodatabase/database test
  test-db-wasm-binding:
    name: Test DB bindings on browser
    timeout-minutes: 30
    needs:
      - build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Image ships node 20 + chromium + firefox + system deps. Bump the tag
    # whenever the `playwright` dep in bindings/javascript/yarn.lock changes.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    # GitHub mounts /github/home (uid 1001) as $HOME, but the image runs as
    # root — Firefox refuses to launch unless HOME is root-owned.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Build wasm-common
        run: yarn workspace @tursodatabase/database-wasm-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "db*"
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: yarn workspace @tursodatabase/database-wasm test
  test-sync-linux-x64-gnu-binding:
    name: Test sync bindings on Linux-x64-gnu - node@${{ matrix.node }}
    timeout-minutes: 30
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: useblacksmith/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: ./.github/actions/setup-bazel
      - name: Build tursodb
        working-directory: .
        run: |
          bazel build //cli:tursodb
          mkdir -p target/debug
          cp bazel-bin/cli/tursodb target/debug/tursodb
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Build sync common
        run: yarn workspace @tursodatabase/sync-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "db*"
      - name: Download all sync artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "sync*"
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        env:
          LOCAL_SYNC_SERVER: ${{ github.workspace }}/target/debug/tursodb
        run: yarn workspace @tursodatabase/sync test
  test-sync-windows-x64-msvc-binding:
    name: Test sync bindings on Windows-x64-msvc - node@${{ matrix.node }}
    timeout-minutes: 45
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
      - uses: ./.github/actions/setup-bazel
      - name: Build tursodb
        working-directory: .
        shell: bash
        run: |
          bazel build //cli:tursodb
          mkdir -p target/debug
          cp bazel-bin/cli/tursodb.exe target/debug/tursodb.exe
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Build sync common
        run: yarn workspace @tursodatabase/sync-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "db*"
      - name: Download all sync artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "sync*"
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        env:
          LOCAL_SYNC_SERVER: ${{ github.workspace }}/target/debug/tursodb
        run: yarn workspace @tursodatabase/sync test
  test-sync-wasm-binding:
    name: Test sync bindings on browser
    timeout-minutes: 30
    needs:
      - build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Image ships node 20 + chromium + firefox + system deps. Bump the tag
    # whenever the `playwright` dep in bindings/javascript/yarn.lock changes.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    # GitHub mounts /github/home (uid 1001) as $HOME, but the image runs as
    # root — Firefox refuses to launch unless HOME is root-owned.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Install build toolchain
        run: apt-get update && apt-get install -y --no-install-recommends build-essential curl
      - name: Install Bazelisk
        run: |
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o /usr/local/bin/bazel
          chmod +x /usr/local/bin/bazel
      - name: Build tursodb
        working-directory: .
        run: |
          bazel build //cli:tursodb
          mkdir -p target/debug
          cp bazel-bin/cli/tursodb target/debug/tursodb
      - name: Install dependencies
        run: yarn install
      - name: Build common
        run: yarn workspace @tursodatabase/database-common build
      - name: Build wasm-common
        run: yarn workspace @tursodatabase/database-wasm-common build
      - name: Build sync common
        run: yarn workspace @tursodatabase/sync-common build
      - name: Download all DB artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "db*"
      - name: Download all sync artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "sync*"
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        env:
          LOCAL_SYNC_SERVER: ${{ github.workspace }}/target/debug/tursodb
        run: yarn workspace @tursodatabase/sync-wasm test
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    needs:
      - test-db-linux-x64-gnu-binding
      - test-db-windows-x64-msvc-binding
      - test-db-wasm-binding
      - test-sync-linux-x64-gnu-binding
      - test-sync-windows-x64-msvc-binding
      - test-sync-wasm-binding
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Update npm
        run: npm install -g npm@11
      - name: Download all DB artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "db*"
      - name: Download all sync artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/javascript
          merge-multiple: true
          pattern: "sync*"
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Install dependencies
        run: yarn install
      - name: Install dependencies
        run: yarn tsc-build
      - name: Publish
        if: "startsWith(github.ref, 'refs/tags/v')"
        run: |
          if git log -1 --pretty=%B | grep "^Turso [0-9]\+\.[0-9]\+\.[0-9]\+$";
          then
            npm publish --workspaces --access public --provenance
          elif git log -1 --pretty=%B | grep "^Turso [0-9]\+\.[0-9]\+\.[0-9]\+";
          then
            npm publish --workspaces --access public --provenance --tag next
          else
            echo "git log structure is unexpected, skip publishing"
            npm publish --workspaces --dry-run
          fi
      - name: Publish (dry-run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          npm pack --workspaces
