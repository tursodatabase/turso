name: "Pull Request Labeler"
on:
  pull_request_target:
    branches:
      - main

jobs:
  labeler:
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
