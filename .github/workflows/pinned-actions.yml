name: Pinned actions

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check-pinned-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check that actions are pinned to a full-length commit SHA
        run: python3 scripts/check-pinned-actions.py
