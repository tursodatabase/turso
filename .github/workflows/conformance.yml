name: Conformance tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript conformance tests
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup node
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        with:
          node-version: 24
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: conformance-js-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            conformance-js-cargo-
      - name: Install JS binding dependencies
        working-directory: bindings/javascript
        run: yarn install
      - name: Build JS native module
        working-directory: bindings/javascript
        run: yarn build:native
      - name: Install test dependencies
        working-directory: testing/conformance/javascript
        run: npm install
      - name: Run conformance tests against Turso
        working-directory: testing/conformance/javascript
        run: npm run test:turso
      - name: Run conformance tests against better-sqlite3
        working-directory: testing/conformance/javascript
        run: npm run test:better-sqlite3

  sqlite-tcl:
    name: SQLite TCL conformance tests (part ${{ matrix.part }}/3)
    timeout-minutes: 60
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The suite runs its test files one at a time (they share files in the
    # test directory), so it is spread over several machines instead.
    # all.test picks this part's files; every file runs in exactly one part.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: conformance-sqlite-tcl-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            conformance-sqlite-tcl-cargo-
      - name: Install TCL dev headers
        run: sudo apt-get update && sudo apt-get install -y tcl-dev tcl
      - name: Build libturso_tcl
        run: make -C bindings/tcl build
      - name: Run SQLite TCL conformance tests
        env:
          TCL_TEST_PART: ${{ matrix.part }}/3
        run: tclsh sqlite/conformance/upstream/all.test
      - name: Upload per-file test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqlite-tcl-logs-part-${{ matrix.part }}
          path: sqlite/conformance/upstream/logs/
          if-no-files-found: ignore
