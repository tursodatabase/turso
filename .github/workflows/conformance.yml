name: Conformance tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript conformance tests
    timeout-minutes: 30
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: useblacksmith/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bazel
      - name: Install JS binding dependencies
        working-directory: bindings/javascript
        run: yarn install
      - name: Build JS native module
        run: |
          bazel build //bindings/javascript:turso_node_cdylib
          cp bazel-bin/bindings/javascript/libturso_node.so \
            bindings/javascript/packages/native/turso.linux-x64-gnu.node
          yarn workspace @tursodatabase/database-common build
      - name: Install test dependencies
        working-directory: testing/conformance/javascript
        run: npm install
      - name: Run conformance tests against Turso
        working-directory: testing/conformance/javascript
        run: npm run test:turso
      - name: Run conformance tests against better-sqlite3
        working-directory: testing/conformance/javascript
        run: npm run test:better-sqlite3

  sqlite-tcl:
    name: SQLite TCL conformance tests
    timeout-minutes: 60
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel
      - name: Install TCL dev headers
        run: sudo apt-get update && sudo apt-get install -y tcl-dev tcl
      - name: Build libturso_tcl
        run: |
          bazel build //bindings/c:turso_sqlite3_cdylib
          gcc -shared -fPIC -o bindings/tcl/libturso_tcl.so \
            bindings/tcl/turso_tcl.c \
            -I bindings/c/include \
            -I /usr/include/tcl8.6 \
            -L bazel-bin/bindings/c \
            -lturso_sqlite3 \
            -ltcl8.6 \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/bazel-bin/bindings/c"
      - name: Run SQLite TCL conformance tests
        run: tclsh sqlite/conformance/upstream/all.test
