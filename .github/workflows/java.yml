name: Java Tests

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  working-directory: bindings/java

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ env.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bazel

      - name: Set up JDK
        uses: useblacksmith/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "8"

      - name: Build native library
        working-directory: ${{ github.workspace }}
        run: |
          bazel build //bindings/java:turso_java_cdylib
          mkdir -p bindings/java/src/test/resources/turso/debug
          cp bazel-bin/bindings/java/lib_turso_java.so \
            bindings/java/src/test/resources/turso/debug/lib_turso_java.so

      - name: Run Java tests
        run: ./gradlew spotlessCheck test
