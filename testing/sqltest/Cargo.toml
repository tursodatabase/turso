[package]
name = "sqltest"
version = "0.1.0"
edition = "2024"
description = "SQL test runner for Turso/Limbo with custom DSL"
license = "MIT"
repository = "https://github.com/tursodatabase/turso"

[lib]
path = "src/lib.rs"

[dependencies]
# CLI
clap = { workspace = true, features = ["derive"] }

# Parsing
logos = "0.16"
regex = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Utilities
tempfile = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
similar = { workspace = true }
num_cpus = "1"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"

# Output formatting
owo-colors = "4.2.3"
indicatif = "0.17"

# Error reporting
miette = { workspace = true, features = ["fancy"] }

# File globbing
glob = "0.3"

chumsky = { workspace = true }

# Turso SQL parser (for splitting multi-statement SQL) and the AST it produces
turso_ast = { workspace = true }
turso_parser = { workspace = true }
query-result-oracle = { path = "../query-result-oracle" }

# Bundled SQLite: the in-process oracle matrix cases are verified against.
# The bundled version is pinned by Cargo.lock; upgrading it is a deliberate,
# reviewable event because expected results follow SQLite's behavior.
rusqlite = { workspace = true }
rand = { workspace = true }

# PostgreSQL wire-protocol client (for the tursopg and postgres backends,
# which drive a tursopg server or a real PostgreSQL server over TCP)
turso_pg_client = { workspace = true }
pg_query = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"
