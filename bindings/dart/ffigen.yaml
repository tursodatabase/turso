# Regenerate with: dart run ffigen --config ffigen.yaml
name: TursoBindings
description: Raw FFI bindings for the turso_sqlite3 C API.
output: 'lib/src/bindings.g.dart'
# Bind to the code asset that hook/build.dart produces, so the library is
# bundled by Dart or Flutter instead of opened by hand at runtime.
ffi-native:
  asset-id: 'package:turso/src/bindings.g.dart'
headers:
  entry-points:
    - '../c/include/sqlite3.h'
  # Without this, stdint.h drags in every system declaration it can see.
  include-directives:
    - '**/c/include/sqlite3.h'
functions:
  include:
    - 'sqlite3_.*'
    - 'turso_.*'
macros:
  include:
    - 'SQLITE_.*'
preamble: |
  // Generated by package:ffigen from ../c/include/sqlite3.h. Do not edit.
  // ignore_for_file: type=lint, unused_field, camel_case_types, non_constant_identifier_names
