# Not a workspace member: this crate only builds for wasm32-unknown-unknown,
# and joining the workspace would break `cargo build` on the host.
[package]
name = "turso_wasm"
version = "0.8.0-pre.4"
authors = ["the Turso authors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/tursodatabase/turso"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
turso_core = { path = "../../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
