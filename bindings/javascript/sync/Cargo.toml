[package]
name = "turso_sync_js"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
# No unit tests exist, and the autogenerated test harness cannot run anyway:
# it links `turso_node` compiled without cfg(test), whose napi registration
# ctors reference napi_* symbols that only exist inside a Node process, so
# the binary dies at load with "undefined symbol: napi_typeof" and breaks
# `cargo nextest` test listing for the whole workspace.
test = false
doctest = false

[dependencies]
napi = { version = "3.8.3", default-features = false, features = ["napi6"] }
napi-derive = { version = "3.5.2", default-features = true }
turso_sync_engine = { workspace = true }
turso_core = { workspace = true, features = ["fts"] }
turso_node = { workspace = true }
genawaiter = { version = "0.99.1", default-features = false }
tracing-subscriber = { workspace = true }
tracing.workspace = true

[build-dependencies]
napi-build = "2.3.1"

[features]
browser = ["turso_node/browser"]
