\* TLC Configuration for MultiprocessWal

SPECIFICATION Spec

\* Model values
CONSTANTS
    p1 = p1
    p2 = p2
    NOCONN = NOCONN

\* Bind constants
CONSTANTS
    Processes = {p1, p2}
    ConnsPerProcess = 2
    MaxVersion = 3
    NoConn = NOCONN

\* Invariants
INVARIANT TypeOK
INVARIANT DatabaseFileNotAheadOfReaders
INVARIANT DatabaseFileNotBehindReaders
INVARIANT WalNotRestartedUnderWalReaders
INVARIANT SingleWriter
INVARIANT RegistrationsMatchTransactions
INVARIANT WriterCanRestartWhenAlone
