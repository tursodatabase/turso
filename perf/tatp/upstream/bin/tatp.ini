//tatp_ini
//
// This is an example tatp.ini file of TeleComm One Benchmark Suite
//
// ==== TIRDB connect string
TIRDBConnect = "DSN=TIRDB;UID=dba;PWD=dba"
// ==== Name of the main log file
Log = "tatp.log"
// ==== Remote nodes 
RemoteNodes = "remoteNodes.ini"
// ==== Client synchronization threshold (milliseconds)
SynchThreshold = 1000
// When using accelerator, method for waiting the DB to be ready
// -1 is polling
WaitDatabaseStart = -1