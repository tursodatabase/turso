[package]
name = "turso_serverless"
version = "0.1.3"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Turso serverless driver: SQL over HTTP for serverless and edge environments"

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
default = ["tls-aws-lc"]
tls-aws-lc = ["reqwest/rustls"]
tls-ring = ["dep:rustls", "rustls/ring"]

[dependencies]
base64 = "0.22"
bytes = "1"
futures = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "stream",
    "system-proxy",
    "rustls-no-provider",
] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
tokio = { workspace = true, features = ["full"] }
